name: Notificar Atualização OTA (FCM)

on:
  push:
    branches: [main]
    paths:
      - 'toolserver.json'
  workflow_dispatch:

jobs:
  send-ota-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Instalar google-auth e enviar Push via FCM HTTP v1
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 -m pip install --quiet google-auth requests
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.error
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          with open("toolserver.json", "r", encoding="utf-8") as f:
              manifest = json.load(f)

          sa = json.loads(os.environ["SA_JSON"])
          project_id = sa["project_id"]

          creds = service_account.Credentials.from_service_account_info(
              sa,
              scopes=["https://www.googleapis.com/auth/firebase.messaging"]
          )
          creds.refresh(Request())
          token = creds.token

          v_name = str(manifest.get("versionName", ""))
          v_code = str(manifest.get("versionCode", 0))
          is_mandatory = bool(manifest.get("mandatory", False))
          changelog = str(manifest.get("changelog", "Toque para atualizar o ENTITY404 ToolServer."))

          titulo = f"Atualização Obrigatória • v{v_name}" if is_mandatory else f"Nova versão disponível • v{v_name}"
          corpo = changelog.splitlines()[0] if changelog else "Toque para atualizar o ENTITY404 ToolServer."

          payload = {
              "message": {
                  "topic": "ota_updates",
                  "notification": {
                      "title": titulo,
                      "body": corpo
                  },
                  "android": {
                      "priority": "high",
                      "ttl": "86400s",
                      "notification": {
                          "channel_id": "entity404_ota_alerts",
                          "notification_priority": "PRIORITY_MAX",
                          "default_sound": True,
                          "default_vibrate_timings": True,
                          "icon": "ic_launcher",
                          "color": "#00E5FF"
                      }
                  },
                  "data": {
                      "extra_open_ota": "true",
                      "type": "ota_update",
                      "versionCode": v_code,
                      "versionName": v_name,
                      "apkUrl": str(manifest.get("apkUrl", "")),
                      "changelog": changelog,
                      "mandatory": str(is_mandatory).lower(),
                      "sha256": str(manifest.get("sha256", "")),
                      "minVersionCode": str(manifest.get("minVersionCode", 1)),
                      "sizeLabel": str(manifest.get("sizeLabel", ""))
                  }
              }
          }

          url = f"https://fcm.googleapis.com/v1/projects/{project_id}/messages:send"
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json; charset=utf-8"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  print("Push de Sistema enviado com sucesso:", resp.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              print("Erro HTTP FCM:", e.code, e.read().decode("utf-8"))
              raise
          EOF
